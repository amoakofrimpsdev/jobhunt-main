<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Jobhunt</title>
<style>
  html, body { margin: 0; height: 100%; background: #fffaf0; }
  body { display: flex; flex-direction: column; font: 13px/1.45 -apple-system, "Inter", "Segoe UI", Roboto, sans-serif; color: #3a3a3a; }
  header { display: flex; align-items: center; gap: 8px; padding: 14px 16px; border-bottom: 1px solid #e7e1d0; }
  header b { font-size: 18px; font-weight: 500; letter-spacing: -.03em; color: #0a0a0a; }
  main { flex: 1; overflow-y: auto; padding: 16px; }
  .idle { padding: 14px; border-radius: 12px; background: #f5f0e0; color: #0a0a0a; }
  .idle p { margin: 6px 0 0; color: #3a3a3a; }
  footer { padding: 10px 16px; border-top: 1px solid #e7e1d0; color: #6a6a6a; font-size: 11px; }
</style>
<style id="view-css"></style>
</head>
<body>
  <header><span id="mark"></span><b>Jobhunt</b></header>
  <main id="mount"></main>
  <footer>Talks only to the Jobhunt app on this computer. Never presses Submit.</footer>
  <script src="view.js"></script>
  <script src="sidepanel.js"></script>
</body>
</html>
